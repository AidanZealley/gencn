name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR replaces an older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      # Build first: the registry and playground import core's dist.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec prettier --check .
